# The lesson map for the whole book, in reading order.
# tools/build_nav.py reads this file and updates the nav in mkdocs.yml,
# docs/progress.md, and the lesson list in each folder's index.md.
# The start-here pages (docs/00-start-here) are listed in build_nav.py, not here.
#
# File paths come from the order here:
#   flat folder:      docs/<folder>/<NN>-<slug>.md
#   chaptered folder: docs/<folder>/<NN>-<chapter>/<NN>-<slug>.md
# A lesson entry is [slug, title] or [slug, title, flags] where flags can
# contain "optional" and/or "fast".

folders:
  - folder: 01-how-computers-work
    title: "How computers work"
    tab: "Computers"
    summary: "How information is stored as bits, how the hardware runs it, and how the code you write becomes a running program."
    before: "Nothing. This is the start."
    chapters:
      - slug: bits-and-data
        title: "Bits and data"
        lessons:
          - [binary-and-hexadecimal, "Binary and hexadecimal"]
          - [bits-bytes-and-units, "Bits, bytes and units"]
          - [integers-and-twos-complement, "Integers and two's complement"]
          - [floating-point, "Floating point"]
          - [text-ascii-and-unicode, "Text, ASCII and Unicode"]
          - [files-images-and-sound-as-bytes, "Files, images and sound as bytes"]
      - slug: hardware
        title: "Hardware"
        lessons:
          - [transistors-and-logic-gates, "Transistors and logic gates"]
          - [boolean-algebra-and-circuits, "Boolean algebra and circuits"]
          - [the-cpu, "The CPU"]
          - [memory-hierarchy-and-latency-numbers, "Memory hierarchy and latency numbers"]
          - [storage-io-and-buses, "Storage, I/O and buses"]
          - [gpus-and-parallel-hardware, "GPUs and parallel hardware", ["optional"]]
      - slug: code-to-running-program
        title: "From code to running program"
        lessons:
          - [machine-code-and-assembly, "Machine code and assembly"]
          - [compilers-interpreters-and-jit, "Compilers, interpreters and JIT"]

