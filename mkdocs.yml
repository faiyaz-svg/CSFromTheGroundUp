site_name: CS From the Ground Up
site_description: A self-study computer science and software development textbook, from bits and transistors to the cloud, data and AI-assisted development.
site_url: https://faiyaz-svg.github.io/CSFromTheGroundUp/
repo_url: https://github.com/faiyaz-svg/CSFromTheGroundUp
repo_name: faiyaz-svg/CSFromTheGroundUp
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

# Listing any extension replaces Zensical's defaults, so every extension used is listed here.
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.47/dist/katex.min.js
  - https://unpkg.com/katex@0.16.47/dist/contrib/auto-render.min.js
  - javascripts/prevnext.js
  - javascripts/progress.js
  - javascripts/sqlrunner.js

extra_css:
  - https://unpkg.com/katex@0.16.47/dist/katex.min.css
  - stylesheets/site.css
  - stylesheets/sqlrunner.css

# The nav block below is generated by tools/build_nav.py from tools/lessons.yml.
# nav:start
nav:
  - Home: index.md
# nav:end
